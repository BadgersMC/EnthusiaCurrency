name: Sentinel artifact

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Prepare stable Sentinel artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name 'enthusia-currency-*.jar' ! -name 'original-*' | head -n 1)
          test -n "$JAR"
          rm -rf /tmp/sentinel-plugin
          mkdir -p /tmp/sentinel-plugin/dependencies
          cp "$JAR" /tmp/sentinel-plugin/plugin.jar
          curl --fail --silent --show-error --location \
            https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar \
            -o /tmp/sentinel-plugin/dependencies/Vault.jar
          echo 'a6b5ed97f43a5cf5bbaf00a7c8cd23c5afc9bd003f849875af8b36e6cf77d01d  /tmp/sentinel-plugin/dependencies/Vault.jar' | sha256sum --check --strict

      - name: Upload stable Sentinel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-plugin
          path: /tmp/sentinel-plugin/
          if-no-files-found: error
          retention-days: 30
